[package]
name = "cosmos_coin"
version = "0.2.0"
edition = "2021"

# TODO: custom serde stuff should be feature blocked

[dependencies]
cosmwasm-std = "1.3.1"
cw-utils = "1.0.3"
cw721 = "0.18.0"
cw20-base = { version = "1.0.0", features = ["library"] }
cw721-base = { version = "0.18.0", features = ["library"] }
# TODO: this can be feature blocked
cw721-base-updatable = { version = "1.0.5", features = ["library"] }
schemars = "0.8.12"
serde = { version = "1.0.183", default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.127"
